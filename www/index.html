<!-- zanni:fontpack begin (zanni 0.8.0) -->
<style>
/* zanni · fontpack — three faces, three jobs.
 *
 * Pixel-classical is a three-register voice, and the registers do not swap:
 *
 *   Jacquard 24   display, numerals, drop caps.  A pixel blackletter; it has
 *                 one weight (400) and asking for another gets you a browser
 *                 synthesising a bold, which smears the pixel grid.
 *   EB Garamond   prose, and act names in italic. The humane register.
 *   VT323         everything technical: commands, labels, chips, timestamps.
 *                 A CRT terminal face. NEVER below ~13px CSS — it is a
 *                 bitmap-derived design and it disintegrates when small.
 *
 * The rule that makes it read as one voice rather than three fonts: each
 * face owns a job, and no element borrows another's. Display type is not
 * body copy set larger.
 */

:root {
  --fontpack-display: 'Jacquard 24', 'Cormorant Garamond', serif;
  --fontpack-prose: 'EB Garamond', Georgia, 'Times New Roman', serif;
  --fontpack-mono: 'VT323', ui-monospace, 'Courier New', monospace;
}

.fontpack-display {
  font-family: var(--fontpack-display);
  font-weight: 400;               /* the only weight it has */
  letter-spacing: 0.06em;
  line-height: 1;
}

.fontpack-prose {
  font-family: var(--fontpack-prose);
  line-height: 1.6;
  font-feature-settings: 'kern' 1, 'liga' 1, 'onum' 1;
}

.fontpack-mono {
  font-family: var(--fontpack-mono);
  font-size: max(13px, 1em);      /* the floor, enforced where it is worn */
  letter-spacing: 0.06em;
}
</style>
<!-- zanni:fontpack end -->
<!-- zanni:gesso begin (zanni 0.8.0) -->
<style>
/* zanni · gesso — the ground you paint on.
 *
 * A painter's gesso is the prepared surface: before the picture, the panel.
 * Here it is figar.org's parchment — a flat paper colour with a 6px checker
 * of a slightly darker paper laid over it by a repeating-conic-gradient, so
 * the page reads as a dithered bitmap rather than a flat fill. Two colours
 * and a grid; there is no image and no request.
 *
 * It also carries the palette, because the ground and the ink were chosen
 * against each other and shipping one without the other gives you neither.
 * Every value is a custom property: override them and keep the mechanism.
 */

:root {
  /* paper and its dither */
  --paper: #e7d4c4;
  --paper-2: #dcc4b0;
  --dither: #dfc9b6;
  --gesso-cell: 6px;

  /* ink */
  --ink: #2b1a15;
  --muted: #7a584a;
  --rule: rgba(43, 26, 21, 0.2);

  /* editorial colours — gold is for focus, and ≤2 focal elements per view */
  --gold: #a2762a;
  --gold-bright: #d9a94e;
  --oxblood: #7d2e2e;

  /* the dark register: velvet stage and the type that sits on it */
  --stage: #1a0d0f;
  --stage-2: #271215;
  --stage-ink: #f0dfc8;
  --stage-muted: #a5887b;
}

.gesso {
  background-color: var(--paper);
  background-image: repeating-conic-gradient(var(--dither) 0% 25%, transparent 0% 50%);
  background-size: var(--gesso-cell) var(--gesso-cell);
  color: var(--ink);
}

/* The same ground in the dark register, for panes that read as a stage. */
.gesso-stage {
  background-color: var(--stage);
  background-image: repeating-conic-gradient(var(--stage-2) 0% 25%, transparent 0% 50%);
  background-size: var(--gesso-cell) var(--gesso-cell);
  color: var(--stage-ink);
}

/* Selection should belong to the palette too, or the browser's blue undoes
 * the whole conceit the first time anyone drags a cursor across a line. */
.gesso ::selection { background: rgba(162, 118, 42, 0.25); }
</style>
<!-- zanni:gesso end -->
<!-- zanni:phosphor begin (zanni 0.8.0) -->
<style>
/* zanni · phosphor — the CRT veil.
 *
 * Named for the coating a cathode-ray tube glows through: the scanline is an
 * artefact of that screen, not a decoration added to it. One horizontal comb
 * — 1px of near-black over 2px of nothing — multiplied into whatever is
 * beneath, at half strength.
 *
 * It is an OVERLAY, so it needs a positioned ancestor and it must not eat
 * clicks. Two ways to wear it:
 *
 *   <div class="phosphor-host">        an element whose ::after is the veil
 *     …
 *   </div>
 *
 *   <div class="phosphor"></div>       an explicit sibling, when you need to
 *                                      control where it sits on the z-axis
 *
 * Deliberately NOT applied to the whole page by default. A veil over <body>
 * covers position:fixed chrome as well, and mix-blend-mode: multiply against
 * a transparent backdrop is a well-known way to get a grey rectangle.
 */

.phosphor,
.phosphor-host::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, var(--phosphor-ink, 0.22)) 0 var(--phosphor-line, 1px),
    transparent var(--phosphor-line, 1px) var(--phosphor-pitch, 3px)
  );
  mix-blend-mode: multiply;
  opacity: var(--phosphor-strength, 0.5);
}

.phosphor-host { position: relative; }

/* SOFT — the comb blurred into a wave.
 *
 * The default comb is a square wave: full ink for a pixel, nothing for two.
 * Honest to a CRT seen up close, and on a dense modern display it reads as a
 * fence — worse, a 1px bar on a fractional device-pixel grid aliases into
 * moiré as the page scrolls.
 *
 * This ramps instead of stepping: ink at the line, clear by the middle of the
 * pitch, ink again at the next. A triangular wave rather than a square one,
 * which is what a defocused scanline actually looks like.
 *
 * No blur filter, deliberately. `filter: blur()` here would cost a raster
 * pass AND would blur the content beneath rather than the veil, since the
 * veil is the overlay's own background. The gradient softens for free.
 *
 * Both selectors are compound on purpose. A bare `.phosphor-soft` would match
 * the HOST element and paint the box itself instead of its overlay — I wrote
 * that bug, and the panel went opaque black. zanni-check now forbids it.
 */
.phosphor.phosphor-soft,
.phosphor-host.phosphor-soft::after {
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, var(--phosphor-ink, 0.22)) 0,
    transparent calc(var(--phosphor-pitch, 3px) / 2),
    rgba(0, 0, 0, var(--phosphor-ink, 0.22)) var(--phosphor-pitch, 3px)
  );
}

/* The gentle sibling of the comb: a slow bloom from the centre, as if the
 * tube were warm. Opt-in, and it respects reduced motion — this one CAN be
 * stopped by CSS, because it is a CSS animation and not SMIL. */
.phosphor-bloom {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(46% 52% at 50% 48%,
    rgba(217, 169, 78, 0.13) 0%, rgba(217, 169, 78, 0) 72%);
  mix-blend-mode: screen;
  animation: phosphor-breathe 7s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
}
@keyframes phosphor-breathe { from { opacity: 0.55; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .phosphor-bloom { animation: none; }
}
</style>
<!-- zanni:phosphor end -->

<script type="application/json" id="zanni-boil-config">{"text":[3,7,13,5,11,3],"stage":[7,3,12,5,9,7],"ui":[11,4,9,14,6,11],"dur":{"text":1200,"stage":1600,"ui":1400},"driver":"js"}</script>
<style>
/* zanni · boil — the application layer.
 *
 * Three classes, one rule each. This is the whole public surface.
 *
 * Why classes and not a selector list: figar.org applies the type filter
 * through an eleven-selector list accreted over one workshop. A line-oriented
 * dead-CSS sweep once matched only its LAST line, deleted that line together
 * with the declaration block, and left a dangling comma that annexed the rule
 * after it. The boil silently died and nobody noticed until it was seen.
 * A one-line rule has no last line to eat.
 *
 * The laws are in docs/boil.md and they are not optional. The short form:
 *   - never boil a wrapper: a filter is a containing block for fixed/absolute
 *     descendants and a new stacking context;
 *   - a boiled subtree is ONE raster unit — everything inside re-rasterizes
 *     together on any change;
 *   - give clipped text ~4px of slack: displaced glyphs move ~±scale/2 px.
 */

/* Type and the navbar. Displace → blur → re-crisp. */
.boil-text { filter: url(#pixel-text); }

/* Chrome: frames, rails, ornaments, stage shells. The calmest of the three. */
.boil-ui { filter: url(#pixel-ui); }

/* Diagram SVG. Displacement only — no alpha threshold, ever. */
.boil-stage { filter: url(#pixel-stage); }

/* INTENSITY, chosen at runtime by class.
 *
 * A filter cannot be tuned from CSS: scale and baseFrequency are XML
 * attributes on the filter primitives, not CSS properties, so var() in them
 * does not resolve — it reads as an invalid number and the element renders
 * unfiltered. Verified in Chrome 145. Hence a filter per intensity rather
 * than a custom property.
 *
 * The lever that matters is baseFrequency, not scale. It is the WAVELENGTH of
 * the noise. At 0.9 (the default, as figar.org ships) neighbouring pixels get
 * uncorrelated offsets and the effect reads as fuzz — raise the scale and the
 * glyphs erode rather than bend. At 0.05 neighbouring pixels move together, so
 * whole strokes flex: that is what line boil and Squigglevision actually are.
 *
 * Measured cost of the louder variants: about 5% over the default. Intensity
 * is nearly free. Area is what costs, and animating at all is what costs most. */
.boil-text-squiggle  { filter: url(#pixel-text-squiggle); }
.boil-ui-squiggle    { filter: url(#pixel-ui-squiggle); }
.boil-stage-squiggle { filter: url(#pixel-stage-squiggle); }

.boil-text-strong    { filter: url(#pixel-text-strong); }
.boil-ui-strong      { filter: url(#pixel-ui-strong); }
.boil-stage-strong   { filter: url(#pixel-stage-strong); }

/* FINE — for small type. The wavelength must be comparable to the glyph or
 * the glyph merely translates: at freq 0.05 the wave is ~20px, so 19px mono
 * rides one slow swell and looks still while 56px display type bends nicely.
 * Match the variant to the type size, not to the taste. */
.boil-text-fine      { filter: url(#pixel-text-fine); }
.boil-ui-fine        { filter: url(#pixel-ui-fine); }
.boil-stage-fine     { filter: url(#pixel-stage-fine); }

/* ERODE — short wavelength and a big scale, so edges chew rather than bend.
 * This is texture, not motion, and it costs legibility: use it on display
 * type and headings, never on prose you expect anyone to read. */
.boil-text-erode     { filter: url(#pixel-text-erode); }
.boil-ui-erode       { filter: url(#pixel-ui-erode); }
.boil-stage-erode    { filter: url(#pixel-stage-erode); }

/* Slack for boiled text that sits against a clipping edge. Opt-in: applying
 * it everywhere would shift layout for no reason. */
.boil-slack { padding: 4px; }

/* Reduced motion is NOT handled here, and cannot be — there is no CSS
 * animation to stop. boil.js drives the seed and simply declines to start
 * under prefers-reduced-motion. Ship boil.css without boil.js and the boil is
 * static: displaced, never moving. That is a sane floor rather than a bug. */
</style>
<script>
/* zanni · boil — the seed driver, and the reduced-motion guard.
 *
 * WHY THIS EXISTS AT ALL, and why it is not a SMIL <animate>:
 *
 * A SMIL animation attached to a filter keeps the filtered subtree
 * perpetually dirty. Chrome re-rasterises it every frame — about 60 times a
 * second — even though `calcMode="discrete"` means the OUTPUT only changes
 * five times a second. Fifty-five of every sixty rasters produce a
 * pixel-identical image and are thrown away.
 *
 * Measured (Chrome 145, headless, 1280x900, CPU raster, 5s windows):
 *
 *   no filter at all ............................  0 ms raster
 *   boil with no <animate> ......................  0 ms raster
 *   boil, SMIL dur=20s  (seed changes /3.3s) .... 60.0 s  0.99x
 *   boil, SMIL dur=1.2s (seed changes /0.2s) .... 60.6 s  1.00x
 *   boil, SMIL dur=0.3s (seed changes /0.05s) ... 60.4 s  1.00x
 *   boil, THIS DRIVER, same seeds at the same 5Hz  5.7 s  0.09x
 *
 * The seed RATE is irrelevant to SMIL's cost and decisive for this driver's,
 * which is exactly what "dirty every frame" versus "dirty on change" predicts.
 * Writing the attribute only when the value changes is an 11x saving on the
 * single most expensive thing in this library.
 *
 * Consequences worth knowing:
 *   - Without JS the boil is STATIC — displaced, not moving. That is a
 *     reasonable floor, and it is what reduced-motion readers get too.
 *   - Nothing here runs when the document is hidden; a background tab should
 *     not be rasterising a filter nobody is looking at.
 */
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;

  function start() {
    var el = document.getElementById('zanni-boil-config');
    if (!el) return;                       // defs were inlined without a config
    var cfg;
    try { cfg = JSON.parse(el.textContent); } catch (e) { return; }
    if (cfg.driver === 'smil') return;     // the markup animates itself

    /* Reduced motion: leave every filter on its first seed. Note a CSS
     * `animation: none` cannot do this job — there is no CSS animation here,
     * and there would be no way to stop SMIL from CSS either. */
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var clocks = [];
    ['text', 'stage', 'ui'].forEach(function (which) {
      var seeds = cfg[which];
      if (!seeds || seeds.length < 2) return;
      /* Every variant of one register shares a clock, so a page mixing
       * .boil-text and .boil-text-squiggle still steps in unison rather than
       * beating against itself. */
      var nodes = [];
      ['', '-squiggle', '-fine', '-strong', '-erode'].forEach(function (v) {
        var f = document.getElementById('pixel-' + which + v);
        if (f) {
          var t = f.querySelector('feTurbulence');
          if (t) nodes.push(t);
        }
      });
      if (!nodes.length) return;
      var period = Math.max(1, Math.round((cfg.dur[which] || 1200) / seeds.length));
      clocks.push({ nodes: nodes, seeds: seeds, period: period, i: 0, timer: null });
    });
    if (!clocks.length) return;

    function tick(c) {
      c.i = (c.i + 1) % c.seeds.length;
      var v = String(c.seeds[c.i]);
      for (var j = 0; j < c.nodes.length; j++) {
        /* Only write when it differs. A write is what marks the filter dirty,
         * so a redundant write is a whole wasted raster of the subtree. */
        if (c.nodes[j].getAttribute('seed') !== v) c.nodes[j].setAttribute('seed', v);
      }
    }
    function run() {
      stop();
      clocks.forEach(function (c) { c.timer = setInterval(function () { tick(c); }, c.period); });
    }
    function stop() {
      clocks.forEach(function (c) { if (c.timer) { clearInterval(c.timer); c.timer = null; } });
    }

    document.addEventListener('visibilitychange', function () {
      document.hidden ? stop() : run();
    });
    if (!document.hidden) run();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
<!-- zanni:boil end -->
<!-- zanni:heft begin (zanni 0.8.0) -->
<style>
/* zanni · heft — pick a thing up, throw it about, watch it settle back.
 *
 * Named for the word you use when you lift something to judge its weight.
 * The whole gag is that an object on a page should behave like an object on
 * a table: it moves when you pull it, and it returns when you stop.
 *
 * Extracted from figar.org's `makeDraggable`, including the two decisions
 * that are easy to get wrong and were already got right there:
 *
 *   - It composes via the CSS `translate` PROPERTY, not `transform`. A
 *     filtered or animated element usually already owns its transform; using
 *     translate means the drag and the animation stack instead of fighting,
 *     and neither has to know about the other.
 *
 *   - A filter and a transform both create stacking contexts, so a held
 *     element cannot escape its parent's. Raising the CHILD's z-index does
 *     nothing. `body.hefting` raises the ancestor instead — figar.org lost an
 *     afternoon to this exact bug with a portrait inside a navbar.
 */

/* Ours to move, not the browser's to fling: no native image drag, no ghost,
 * no selection halo. */
.heft {
  -webkit-user-drag: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  touch-action: none;          /* the pointer is ours once a drag is real */
}

.heft.held {
  cursor: grabbing;
  /* docs/motion.md. Removes the filter's ongoing raster cost while held,
   * which is the seed animation, not a cost of moving. */
  filter: none;
  position: relative;
  z-index: 9999;
  /* Any idle float on the element pauses while it is in hand — a thing being
   * held should not also be bobbing on its own. */
  animation-play-state: paused;
}

/* The return. An overshoot curve, so it arrives like something with mass
 * rather than something being tweened. */
.heft.settling {
  transition: translate var(--heft-settle, 650ms) var(--heft-ease, cubic-bezier(0.2, 1.6, 0.3, 1));
}

/* Lift the ANCESTOR, not the child. See the note above: a child cannot climb
 * out of a stacking context its parent created, however large its z-index. */
body.hefting .heft-lift { z-index: 9999; }

@media (prefers-reduced-motion: reduce) {
  /* The drag still works — it is a direct response to the pointer, not
   * decoration. Only the springy return is flattened. */
  .heft.settling { transition: translate 1ms linear; }
}
</style>
<script>
/* zanni · heft — the drag itself.
 *
 * Everything wearing .heft becomes liftable. No configuration, no init call;
 * a MutationObserver picks up anything added later.
 *
 * The subtle part is deciding WHEN a press becomes a drag. A press commits to
 * nothing: the drag begins on the first movement past 8px, and only if no
 * text selection has started. So a pull from the margin throws the object and
 * a pull across words selects them, and neither has to be declared in
 * advance. preventDefault waits until the drag is real, which is why the
 * element is still readable and still clickable.
 */
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;

  var SLACK2 = 64;   /* 8px, squared — compared against the squared distance */

  function selecting() {
    var s = window.getSelection && window.getSelection();
    return !!(s && !s.isCollapsed);
  }

  function arm(el) {
    if (el.__heft) return;
    el.__heft = true;

    var armed = false, on = false, sx = 0, sy = 0, id = null;
    /* Whatever this element must be lifted ABOVE — a navbar, a card — is
     * marked by the author with .heft-lift. A filter or transform on that
     * ancestor makes it a stacking context, and no z-index on the child can
     * escape it. */
    var lift = el.closest ? el.closest('.heft-lift') : null;

    el.addEventListener('dragstart', function (e) { e.preventDefault(); });

    el.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      armed = true; on = false; sx = e.clientX; sy = e.clientY; id = e.pointerId;
    });

    window.addEventListener('pointermove', function (e) {
      if (!armed) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (!on) {
        if (dx * dx + dy * dy < SLACK2) return;      /* still just a press */
        if (selecting()) { armed = false; return; }  /* they are reading */
        on = true;
        el.classList.remove('settling');
        el.classList.add('held');
        if (lift) document.body.classList.add('hefting');
        if (el.setPointerCapture) { try { el.setPointerCapture(id); } catch (_) {} }
      }
      el.style.translate = dx + 'px ' + dy + 'px';
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    function release() {
      armed = false;
      if (!on) return;
      on = false;
      document.body.classList.remove('hefting');
      el.classList.remove('held');
      el.classList.add('settling');
      el.style.translate = '0px 0px';
      /* Longer than the transition, so the class is gone before the next
       * grab and a fresh drag is never animated. */
      setTimeout(function () { el.classList.remove('settling'); }, 720);
    }

    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
    window.addEventListener('blur', release);
  }

  function scan() {
    var all = document.querySelectorAll('.heft');
    for (var i = 0; i < all.length; i++) arm(all[i]);
  }

  function start() {
    scan();
    if (window.MutationObserver) {
      new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
<!-- zanni:heft end -->
<style>
/* gluck-tiers board. Reasoning lives in doc/board.md. */

:root {
  --card-w: 76px;
  --card-h: 76px;
  --gap: 6px;
  --row-min: 62px;
}

* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { min-height: 100%; }

body {
  font-family: var(--fontpack-prose, Georgia, serif);
  padding-bottom: env(safe-area-inset-bottom);
  overscroll-behavior-y: contain;
}

/* ── bar ─────────────────────────────────────────────────────────────── */

.bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 8px 10px;
  background: var(--stage); color: var(--stage-ink);
  border-bottom: 1px solid var(--rule);
}

.title {
  font-family: var(--fontpack-display, Georgia, serif);
  font-size: 19px; font-weight: 400; letter-spacing: 0.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.bar-right { display: flex; align-items: center; gap: 10px; flex: none; }

.saved {
  font-family: var(--fontpack-mono, ui-monospace, monospace);
  font-size: 11px; color: var(--stage-muted); min-width: 5ch; text-align: right;
}

.btn {
  font: inherit; font-family: var(--fontpack-mono, ui-monospace, monospace);
  font-size: 12px; padding: 5px 9px;
  background: var(--stage-2); color: var(--stage-ink);
  border: 1px solid var(--rule); cursor: pointer;
}

/* ── rows ────────────────────────────────────────────────────────────── */

.board { padding: 8px 8px 0; display: flex; flex-direction: column; gap: 8px; }

.row {
  display: grid;
  grid-template-columns: 46px 1fr;
  align-items: stretch;
  border: 1px solid var(--rule);
  background: rgba(255, 255, 255, 0.18);
}

.row-head {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fontpack-display, Georgia, serif);
  font-size: 24px; line-height: 1;
  color: var(--paper); background: var(--tier-bg, var(--muted));
  border-right: 1px solid var(--rule);
  user-select: none;
}

.drop {
  min-height: var(--row-min);
  display: flex; flex-wrap: wrap; align-content: flex-start;
  gap: var(--gap); padding: var(--gap);
}

.drop.over { background: rgba(162, 118, 42, 0.22); outline: 1px dashed var(--gold); outline-offset: -2px; }

/* ── pool ────────────────────────────────────────────────────────────── */

.pool-wrap { padding: 10px 8px 24px; }

.pool-head {
  font-family: var(--fontpack-mono, ui-monospace, monospace);
  font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}

.count { color: var(--gold); }

.pool { border: 1px dashed var(--rule); background: rgba(255, 255, 255, 0.12); }

/* ── card ────────────────────────────────────────────────────────────── */

.card {
  width: var(--card-w);
  display: flex; flex-direction: column;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  position: relative;
}

.thumb-wrap { display: block; width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--stage-2); }

.thumb {
  width: 100%; height: 100%; object-fit: cover; display: block;
  pointer-events: none;
}

/* A card with no image is a text chip, never a broken image icon. */
.card.no-img .thumb-wrap { display: none; }
.card.no-img .chip {
  display: flex; align-items: center; justify-content: center;
  width: 100%; aspect-ratio: 1; padding: 4px;
  font-family: var(--fontpack-display, Georgia, serif);
  font-size: 22px; color: var(--paper); background: var(--oxblood);
}
.card .chip { display: none; }

.lines { display: block; padding: 3px 4px 4px; min-width: 0; }

.name, .sub {
  display: block; font-size: 10px; line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.name { color: var(--ink); }
.sub { color: var(--muted); font-size: 9px; }

.card.held { box-shadow: 0 6px 18px rgba(26, 13, 15, 0.45); }

/* Desktop gets more room, so the cards grow rather than the layout changing. */
@media (min-width: 720px) {
  :root { --card-w: 104px; --row-min: 118px; --gap: 8px; }
  .row { grid-template-columns: 64px 1fr; }
  .row-head { font-size: 34px; }
  .name, .sub { font-size: 11px; }
  .title { font-size: 24px; }
}

@media (prefers-reduced-motion: reduce) {
  .drop.over { outline-style: solid; }
}
</style>
